[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "risk-var-dashboard"
version = "1.0.0"
description = "Educational one-observation-ahead VaR forecasting and coverage diagnostics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
download = ["yfinance>=0.2"]

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "download_data.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
